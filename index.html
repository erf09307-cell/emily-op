    // 跳转到 WhatsApp 的方法 (绑定在主画面“비공개 상담 문의하기 →”按钮上)
    function openWhatsAppChat() {
        // 🚨 请在此处将 85260000000 替换为您真正的 WhatsApp 客服手机号码（带国家代码，不加+号或空格）

    }

    // 跳转到 LINE 的方法 (绑定在右上角“상담 예약 ↗”按钮上)

  <style>
    :root {
      color-scheme: dark;
      --bg: #050d1b;
      --bg2: #08172b;
      --panel: #0b1c33;
      --panel2: #0d2541;
      --line: rgba(117,202,255,.2);
      --cyan: #55eaff;
      --blue: #328fff;
      --white: #f4f9ff;
      --muted: #a9bdd2;
      --ok: #a2f4df;
      --max: 1160px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: Inter, "Pretendard", "Noto Sans KR", system-ui,

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }

    .wrap {
      width: min(var(--max), calc(100% - 44px));
      margin-inline: auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(4,12,25,.88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .nav {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-weight: 950;
      letter-spacing: .15em;
      font-size: 1.08rem;
    }

    .logo span { color: var(--cyan); }

    .navlinks {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: .9rem;
      color: #c5d7e8;
    }

    .navlinks a:hover { color: var(--cyan); }

    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-weight: 850;
      cursor: pointer;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }

    .btn-primary {
      color: #03101c;
      background: linear-gradient(110deg, #55eaff, #9af5ff);
      box-shadow: 0 0 28px rgba(85,234,255,.16);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 32px rgba(85,234,255,.28);
    }

    .btn-ghost {
      border-color: rgba(117,202,255,.36);
      background: rgba(14,42,72,.55);
      color: #f1fbff;
    }

    .btn-ghost:hover { border-color: var(--cyan); }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 78px 0 68px;
      background:
        radial-gradient(ellipse at 78% 42%, rgba(0,127,255,.2), transparent 38%),
        linear-gradient(135deg, #061225, #081a31 58%, #04101f);
    }

    .hero:before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(75,169,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(75,169,255,.045) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, #000, transparent);
    }

    .hero-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: 30px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 7px 13px;
      color: var(--cyan);
      font-size: .75rem;
      letter-spacing: .13em;
      background: rgba(5,24,46,.68);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    h1 {
      font-size: clamp(2.55rem, 5vw, 4.65rem);
      line-height: 1.14;
      letter-spacing: -.055em;
      margin: 23px 0 20px;
      font-weight: 950;
    }

    h1 em {
      font-style: normal;
      color: var(--cyan);
      text-shadow: 0 0 28px rgba(85,234,255,.16);
    }

    .lead {
      font-size: 1.06rem;
      color: #c3d6e9;
      max-width: 560px;
      margin-bottom: 24px;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 28px 0 18px;
    }

    .microcopy {
      font-size: .78rem;
      color: #8faac4;
    }

    /* 右侧原版视觉模块：人体发光扫描图结构与样式 */
    .visual {
      position: relative;
      min-height: 480px;
      display: grid;
      place-items: center;
    }

    .orbit {
      position: absolute;
      width: min(100%, 420px);
      aspect-ratio: 1;
      border: 1px dashed rgba(85,234,255,.25);
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(0,145,255,.08);
    }

    /* 原版发光虚拟人体轮廓和扫描网格特效 */
    .human-silhouette {
      position: relative;
      width: 200px;
      height: 400px;
      background: radial-gradient(circle, rgba(85,234,255,0.2) 0%, transparent 70%);
      border: 2px solid rgba(85,234,255,0.4);
      border-radius: 100px / 50px;
      box-shadow: 0 0 30px rgba(85,234,255,0.25);
      z-index: 1;
    }
    
    .human-silhouette::before {
      content: "";
      position: absolute;
      inset: 20px;
      border: 1px dashed rgba(85,234,255,0.3);
      border-radius: 80px / 40px;
    }

    /* 原版引导发光文本卡片标签 */
    .scan-label {
      position: absolute;
      border: 1px solid rgba(117,202,255,0.25);
      background: rgba(4,19,39,0.85);
      padding: 10px 14px;
      border-radius: 8px;
      color: #d3faff;
      font-size: 0.72rem;
      backdrop-filter: blur(8px);
      z-index: 2;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .scan-label b {
      display: block;
      color: var(--cyan);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      margin-bottom: 3px;
    }

    /* 精准还原三个标签卡片的位置坐标 */
    .label-a { bottom: 12%; left: 0px; }
    .label-b { top: 25%; right: -20px; }
    .label-c { bottom: 24%; right: -20px; }
  </style>
</head>
