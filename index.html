<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Consultation</title>
    <!-- 引入 Tailwind CSS 用于快速构建美观的界面 -->
    <script src="https://tailwindcss.com"></script>
    
    <!-- ==================== [保留] SaleSmartly 核心客服脚本开始 ==================== -->
    <script src="https://plugin-code.salesmartly.com/js/project_839145_873794_1791183960.js"></script>
    <script>
        (function(d, s, id, w, n) {
            w.__ssc = w.__ssc || {};
            w.__ssc.license = 'g21lq1r'; // 您的 SaleSmartly 专属许可证代码
            if (w.ssq) return false;
            n = w.ssq = function() {n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            n.push=n;n.loaded=!0;n.queue=[];
            var js, sjs = d.getElementsByTagName(s);
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            var deUrl = atob('aHR0cHM6Ly9wbHVnaW4tY29kZS5zYWxlc21hcnRseS5jb20='), path = '/chat/widget-v2/code/install.js';
            var cs = d.currentScript, csUrl = deUrl;
            if (cs && cs.src) {var scriptURL = new URL(cs.src); csUrl = scriptURL.origin;}
            js.src = csUrl + path;
            sjs.parentNode.insertBefore(js, sjs);
            js.onerror = function() {
                if (d.getElementById(id)) {var el = d.getElementById(id); el.parentNode.removeChild(el);}
                var newJs = d.createElement(s); newJs.id = id;
                newJs.src = deUrl + path;
                sjs.parentNode.insertBefore(newJs, sjs);
            }
        }(document, 'script', 'ss-chat', window));
    </script>
    <!-- ==================== [保留] SaleSmartly 核心客服脚本结束 ==================== -->

    <!-- ==================== LINE 和 WhatsApp 多渠道跳转脚本 ==================== -->
    <script>
        // 1. 跳转到 WhatsApp 的方法
        function openWhatsAppChat() {
            // 🚨 请在此处将 85260000000 替换为您真正的 WhatsApp 客服手机号码（带国家代码，不加+号或空格）
            var whatsappNumber = "85260000000"; 
            var defaultText = encodeURIComponent("안녕하세요. 비공개 상담 문의드립니다.");
            var url = "https://wa.me" + whatsappNumber + "?text=" + defaultText;
            window.open(url, '_blank');
        }

        // 2. 跳转 to LINE 的方法
        function openLineChat() {
            // 🚨 请在此处将 YOUR_LINE_ID 替换为您真正的 LINE 官方号 ID 或者好友链接
            var lineUrl = "https://line.me"; 
            window.open(lineUrl, '_blank');
        }
    </script>

    <style>
        body {
            background-color: #0b192c; /* 深暗蓝色背景 */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-white font-sans">

    <!-- 主容器卡片 -->
    <div class="w-full max-w-4xl bg-[#15305B] rounded-2xl p-8 md:p-12 shadow-2xl border border-blue-900/30 grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
        
        <!-- 左侧：提示与说明信息 -->
        <div class="space-y-6">
            <div>
                <p class="text-blue-400 uppercase tracking-widest text-xs font-bold mb-3">Private Consultation</p>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-tight text-white mb-6">
                    나에게 필요한 안내,<br>지금 문의해 보세요.
                </h1>
                <p class="text-gray-300 text-sm leading-relaxed mb-6">
                    민감한 건강 고민도 부담 없이 문의하실 수 있도록 프라이빗 상담 채널을 운영하고 있습니다. 원하시는 플랫폼을 선택하여 상담을 시작해 보세요.
                </p>

                <!-- 勾选特性列表 -->
                <ul class="space-y-4 text-sm text-gray-200布">
                    <li class="flex items-start">
                        <span class="text-blue-400 mr-2">✓</span>
                        <span>1:1 비공개 비밀 보장 상담</span>
                    </li>
                    <li class="flex items-start">
                        <span class="text-blue-400 mr-2">✓</span>
                        <span>실시간 대기 중인 전문 상담원 연결</span>
                    </li>
                </ul>
            </div>

            <!-- 左下角黄色边框警告提示 -->
            <div class="border border-amber-500/40 bg-amber-500/5 rounded-xl p-4 text-xs text-amber-300/90 leading-relaxed">
                <strong>운영 전 확인:</strong> 이 템플릿은 의료기관이나 의료진의 자격을 인증하지 않으며 의료 진단·치료를 제공하지 않습니다.
            </div>
        </div>

        <!-- 右侧：原表单已删除，现改为美观的点击咨询通道 -->
        <div class="flex flex-col space-y-4 w-full">
            <h2 class="text-sm font-semibold text-gray-300 tracking-wide mb-2">원하시는 상담 채널을 선택해 주세요</h2>
            
            <!-- WhatsApp 咨询按钮 -->
            <button onclick="openWhatsAppChat()" class="w-full bg-gradient-to-r from-emerald-500 to-green-500 hover:from-emerald-600 hover:to-green-600 text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-green-500/10 flex items-center justify-center space-x-3 text-base">
                <span class="text-lg">💬</span>
                <span>WhatsApp 실시간 상담 시작</span>
                <span>→</span>
            </button>

            <!-- LINE 咨询按钮 -->
            <button onclick="openLineChat()" class="w-full bg-gradient-to-r from-green-400 to-lime-500 hover:from-green-500 hover:to-lime-600 text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-lime-500/10 flex items-center justify-center space-x-3 text-base">
                <span class="text-lg">🟢</span>
                <span>LINE 실시간 상담 시작</span>
                <span>→</span>
            </button>

            <p class="text-center text-[11px] text-gray-400/70 pt-2">
                버튼을 누르면 해당 메신저 앱 또는 웹 화면으로 안전하게 연결됩니다.
            </p>
        </div>

    </div>

</body>
</html>
