<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://tailwindcss.com"></script>
    <script src="https://plugin-code.salesmartly.com/js/project_839145_873794_1791183960.js"></script>
    <script>
        (function(d, s, id, w, n) {
            w.__ssc = w.__ssc || {}; w.__ssc.license = 'g21lq1r'; if (w.ssq) return false;
            n = w.ssq = function() {n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            n.push=n;n.loaded=!0;n.queue=[]; var js, sjs = d.getElementsByTagName(s); if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id; var deUrl = atob('aHR0cHM6Ly9wbHVnaW4tY29kZS5zYWxlc21hcnRseS5jb20='), path = '/chat/widget-v2/code/install.js';
            var cs = d.currentScript, csUrl = deUrl; if (cs && cs.src) {var scriptURL = new URL(cs.src); csUrl = scriptURL.origin;} js.src = csUrl + path; sjs.parentNode.insertBefore(js, sjs);
            js.onerror = function() { if (d.getElementById(id)) {var el = d.getElementById(id); el.parentNode.removeChild(el);} var newJs = d.createElement(s); newJs.id = id; newJs.src = deUrl + path; sjs.parentNode.insertBefore(newJs, sjs); }
        }(document, 'script', 'ss-chat', window));
        
        function openSaleSmartlyChat() {
            if (window.ssq && typeof window.ssq === 'function') { window.ssq('open'); window.ssq('maximize'); }
            else { alert('상담 대화창을 불러오는 중입니다.'); }
        }
    </script>
    <style> body { background-color: #0b192c; } </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-white font-sans">
    <div class="w-full max-w-5xl bg-[#15305B] rounded-2xl p-6 md:p-12 shadow-2xl border border-blue-900/30 grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="flex flex-col justify-between space-y-4">
            <div>
                <p class="text-blue-400 uppercase tracking-widest text-xs font-bold mb-1">Private Consultation</p>
                <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight leading-tight">나에게 필요한 안내,<br>지금 문의해 보세요.</h1>
                <p class="text-gray-300 text-xs mt-4">아래 양식은 예약 문의 화면의 시안입니다. 제출 버튼을 누르면 실시간 대화창이 열립니다.</p>
            </div>
            <div class="border border-amber-500/40 bg-amber-500/5 rounded-xl p-4 text-[11px] text-amber-300/90">
                <strong>운영 전 확인:</strong> 이 템플릿은 의료 진단·치료를 제공하지 않습니다.
            </div>
        </div>
        <form class="space-y-4" onsubmit="event.preventDefault(); openSaleSmartlyChat();">
            <div>
                <label class="block text-xs text-gray-300 mb-1">문의 주제 *</label>
                <select required class="w-full bg-[#0D2142] border border-gray-700 rounded-lg px-3 py-2 text-sm"><option value="">선택해 주세요</option><option value="1">일반 예약 문의</option></select>
            </div>
            <div>
                <label class="block text-xs text-gray-300 mb-1">회신받을 연락처 또는 이메일 *</label>
                <input type="text" required placeholder="전화번호 또는 이메일 주소" class="w-full bg-[#0D2142] border border-gray-700 rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="flex items-start space-x-2 pt-2">
                <input type="checkbox" id="privacy" required class="mt-1">
                <label for="privacy" class="text-[11px] text-gray-300 cursor-pointer">개인정보 수집·이용 안내 및 정보 제공에 동의합니다.</label>
            </div>
            <div class="pt-2">
                <button type="submit" class="w-full bg-gradient-to-r from-cyan-400 to-teal-400 text-gray-900 font-bold py-3 px-6 rounded-full text-sm">예약 문의 제출 →</button>
            </div>
        </form>
    </div>
</body>
</html>
