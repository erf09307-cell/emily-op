  <style>
    :root {
      color-scheme: dark;
      --bg: #050d1b;
      --bg2: #08172b;
      --panel: #0b1c33;
      --panel2: #0d2541;
      --line: rgba(117,202,255,.2);
      --cyan: #55eaff;
      --blue: #328fff;
      --white: #f4f9ff;
      --muted: #a9bdd2;
      --ok: #a2f4df;
      --max: 1160px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: Inter, "Pretendard", "Noto Sans KR", system-ui,
        -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }

    .wrap {
      width: min(var(--max), calc(100% - 32px)); /* 手机端两边精致留白 */
      margin-inline: auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(4,12,25,.88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .nav {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      font-weight: 950;
      letter-spacing: .15em;
      font-size: 1.08rem;
    }

    .logo span { color: var(--cyan); }

    .navlinks {
      display: flex;
      align-items: center;
    }

    .btn {
      min-height: 48px; /* 完美符合移动端手指头点击的安全高度 */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-weight: 850;
      transition: transform .2s, box-shadow .2s;
    }

    .btn-primary {
      color: #03101c;
      background: linear-gradient(110deg, #55eaff, #9af5ff);
      box-shadow: 0 0 24px rgba(85,234,255,.16);
    }

    .btn-primary:active, .btn-yellow-glow:active {
      transform: scale(0.97); /* 手机端手指按下去时的物理弹性回馈 */
    }

    /* 🌟 新增：专为吸引韩国人设计的金黄色无限呼吸闪烁特效（LINE专用） */
    .btn-yellow-glow {
      color: #03101c !important;
      background: linear-gradient(110deg, #ffe600, #ffb700) !important;
      box-shadow: 0 0 20px rgba(255, 230, 0, 0.45) !important;
      border-radius: 6px !important; /* 还原韩国主流卡片式直角精细观感 */
      animation: pulseGlow 2.2s infinite ease-in-out; /* 激活无限循环动画 */
    }

    /* 呼吸发光特效算法：规律地微幅放大并加深金黄色光晕，形成天然视觉引流 */
    @keyframes pulseGlow {
      0% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
      }
      50% {
        transform: scale(1.05); /* 微微膨胀 5% 锁住视线 */
        box-shadow: 0 0 32px rgba(255, 230, 0, 0.85); /* 黄金光晕发光加倍 */
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
      }
    }

    .btn-ghost {
      border-color: rgba(117,202,255,.36);
      background: rgba(14,42,72,.55);
      color: #f1fbff;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 40px 0 60px; 
      background:
        radial-gradient(circle at 50% 80%, rgba(0,127,255,.18), transparent 50%),
        linear-gradient(180deg, #061225, #04101f);
    }

    .hero:before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(75,169,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(75,169,255,.035) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, #000, transparent);
    }

    /* 移动端强制开启一列垂直向下排布，保证小屏绝对不发生版面散架 */
    .hero-grid {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* 当屏幕大于 992px（电脑端）时，无缝切回高大上的双列并排版式 */
    @media (min-width: 992px) {
      .hero {
        padding: 78px 0 68px;
        background:
          radial-gradient(ellipse at 78% 42%, rgba(0,127,255,.2), transparent 38%),
          linear-gradient(135deg, #061225, #081a31 58%, #04101f);
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.05fr .95fr;
        align-items: center;
        gap: 30px;
        flex-direction: row;
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 7px 13px;
      color: var(--cyan);
      font-size: .75rem;
      letter-spacing: .13em;
      background: rgba(5,24,46,.68);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    h1 {
      font-size: clamp(2.0rem, 6vw, 4.2rem); 
      line-height: 1.2;
      letter-spacing: -.05em;
      margin: 18px 0;
      font-weight: 950;
    }

    h1 em {
      font-style: normal;
      color: var(--cyan);
      text-shadow: 0 0 28px rgba(85,234,255,.16);
    }

    .lead {
      font-size: 1.0rem;
      color: #c3d6e9;
      max-width: 560px;
      margin-bottom: 20px;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap; 
      margin: 24px 0 16px;
    }

    .microcopy {
      font-size: .75rem;
      color: #8faac4;
    }

    .visual {
      position: relative;
      width: 100%;
      min-height: 380px;
      display: grid;
      place-items: center;
      overflow: visible;
      margin-top: 10px;
    }

    @media (min-width: 992px) {
      .visual {
        min-height: 480px;
        margin-top: 0;
      }
    }

    .orbit {
      position: absolute;
      width: min(100%, 340px);
      aspect-ratio: 1;
      border: 1px dashed rgba(85,234,255,.2);
      border-radius: 50%;
    }
    
    @media (min-width: 992px) {
      .orbit { width: min(100%, 420px); }
    }

    .human-silhouette {
      position: relative;
      width: 150px;
      height: 320px;
      background: radial-gradient(circle, rgba(85,234,255,0.18) 0%, transparent 70%);
      border: 2px solid rgba(85,234,255,0.35);
      border-radius: 100px / 50px;
      box-shadow: 0 0 24px rgba(85,234,255,0.2);
      z-index: 1;
    }

    @media (min-width: 992px) {
      .human-silhouette {
        width: 200px;
        height: 400px;
      }
    }
    
    .human-silhouette::before {
      content: "";
      position: absolute;
      inset: 15px;
      border: 1px dashed rgba(85,234,255,0.25);
      border-radius: 80px / 40px;
    }

    .scan-label {
      position: absolute;
      border: 1px solid rgba(117,202,255,0.2);
      background: rgba(4,19,39,0.88);
      padding: 8px 12px;
      border-radius: 8px;
      color: #d3faff;
      font-size: 0.68rem;
      backdrop-filter: blur(8px);
      z-index: 2;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      white-space: nowrap;
    }

    .scan-label b {
      display: block;
      color: var(--cyan);
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }

    .label-a { bottom: 8%; left: -5px; }
    .label-b { top: 15%; right: -10px; }
    .label-c { bottom: 26%; right: -10px; }

    @media (min-width: 992px) {
      .scan-label { font-size: 0.72rem; padding: 10px 14px; }
      .scan-label b { font-size: 0.65rem; }
      .label-a { bottom: 12%; left: 0px; }
      .label-b { top: 25%; right: -20px; }
      .label-c { bottom: 24%; right: -20px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="wrap nav">
      <div class="logo">MEN<span>HANCE</span></div>
      <div class="navlinks">
