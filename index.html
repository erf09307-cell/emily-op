<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MENHANCE | 프리미엄 남성 건강 컨설팅 및 프라이빗 심리 상담</title>
    <style>
        /* [Cloudflare Pages 100% 호환 보장] 완전 정적(Static) 마스터 프레임워크 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", "Pretendard", sans-serif;
            letter-spacing: -0.5px;
        }

        body, html {
            width: 100%;
            background-color: #040c1e;
            color: #ffffff;
            scroll-behavior: smooth;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ---------------- 상단 정적 네비게이션 바 ---------------- */
        .top-navbar {
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background-color: #040c1e;
            position: relative;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            height: 74px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .company-logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .company-logo span {
            color: #ffcc00;
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            font-size: 15px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .nav-menu a:hover {
            color: #ffcc00;
        }

        /* ---------------- 히어로 메인 섹션 ---------------- */
        .hero-section {
            width: 100%;
            background: linear-gradient(135deg, #061539 0%, #040c1e 100%);
            padding: 80px 0;
        }

        .main-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        .content-left {
            flex: 1.2;
            max-width: 650px;
        }

        .eyebrow-badge {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            color: #ffcc00;
            background: rgba(255, 204, 0, 0.1);
            border: 1px solid rgba(255, 204, 0, 0.2);
            padding: 6px 14px;
            border-radius: 99px;
            margin-bottom: 25px;
        }

        .main-title {
            font-size: 46px;
            font-weight: 900;
            line-height: 1.4;
            margin-bottom: 22px;
            color: #ffffff;
        }

        .highlight-text {
            color: #ffcc00;
        }

        .sub-title {
            font-size: 17px;
            color: #94a3b8;
            margin-bottom: 45px;
            line-height: 1.75;
        }

        /* 정적 버튼 레이아웃 */
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-line {
            background-color: #06C755;
            color: #ffffff;
            border: none;
        }

        .btn-line:hover {
            background-color: #05b34c;
        }

        .btn-kakao {
            background-color: #ffcc00;
            color: #191919;
            border: none;
        }

        .btn-kakao:hover {
            background-color: #e6b800;
        }

        /* ---------------- 우측 전담 카운셀러 안내 구역 ---------------- */
        .image-right {
            flex: 0.8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .premium-static-box {
            width: 100%;
            max-width: 400px;
            height: 460px;
            background-color: #09132a;
            border: 1px solid rgba(255, 204, 0, 0.25);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            text-align: center;
        }

        .avatar-silhouette {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #ffcc00, #1d4ed8);
            margin-bottom: 25px;
        }

        .center-status-text {
            background-color: #06C755;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        /* ---------------- 프로그램 안내 및 전문 소견 섹션 ---------------- */
        .article-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section-head {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 60px auto;
        }

        .section-kicker {
            color: #ffcc00;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 36px;
            font-weight: 900;
        }

        .article-grid {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .article-card {
            background-color: #09132a;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            flex: 1;
            min-width: 320px;
        }

        .card-number {
            font-size: 14px;
            font-weight: 800;
            color: #ffcc00;
            margin-bottom: 20px;
        }

        .article-card h3 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 18px;
            color: #ffffff;
        }

        .article-card p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.8;
        }

        /* ---------------- 하단 컴플라이언스 정식 푸터 ---------------- */
        .footer-section {
            background-color: #020612;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 60px 20px;
            font-size: 13px;
            color: #64748b;
            line-height: 2;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-top-links {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .footer-top-links a {
            color: #94a3b8;
            font-weight: 600;
        }

        .footer-top-links a:hover {
            color: #ffcc00;
        }

        .corporate-info-box {
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
            opacity: 0.85;
        }

        .legal-notice {
            margin-top: 25px;
            font-size: 12px;
            color: #475569;
            border-top: 1px dashed rgba(255, 255, 255, 0.05);
            padding-top: 20px;
            text-align: center;
            line-height: 1.7;
        }

        @media (max-width: 992px) {
            .nav-menu { display: none; }
            .main-container { flex-direction: column; text-align: center; padding: 40px 20px; }
            .content-left { margin-bottom: 40px; width: 100%; }
            .main-title { font-size: 34px; }
            .btn-group { flex-direction: column; width: 100%; gap: 14px; }
            .btn { width: 100%; }
            .image-right { width: 100%; }
            .premium-static-box { height: auto; padding: 30px 20px; }
            .article-grid { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- 1. 네비게이션 헤더 -->
    <header class="top-navbar">
        <div class="nav-container">
            <div class="company-logo">MENHANCE <span>CONSULTING</span></div>
            <nav class="nav-menu">
                <a href="#about">회사소개</a>
                <a href="#services">이용약관</a>
                <a href="#services">개인정보처리방침</a>
                <a href="#">고객안내센터</a>
            </nav>
        </div>
    </header>

    <!-- 2. 히어로 메인 영역 -->
    <section class="hero-section" id="about">
        <div class="main-container">
            
            <div class="content-left">
                <div class="eyebrow-badge">GLOBAL MEN's PSYCHOLOGY STANDARD</div>
                <h1 class="main-title">
                    국내 유일의<br>

                </p>
                <div class="btn-group">
                    <a href="https://line.me" class="btn btn-line" target="_blank">Official LINE 상담 센터</a>
                    <a href="https://kakao.com" class="btn btn-kakao" target="_blank">KakaoTalk 실시간 채널</a>

            </div>

            <!-- 우측 박스: 프라이빗 전담 카운셀러 안내문 영역 -->
